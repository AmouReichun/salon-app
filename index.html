<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.json">

<title>次回予約管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kana','Hiragino Sans',sans-serif;background:#f5f5f5;color:#1a1a1a;font-size:14px;min-height:100dvh}
.safe-top{height:env(safe-area-inset-top)}
.app-bar{background:#fff;border-bottom:0.5px solid #e0e0e0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.app-bar-left{display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;background:#E1F5EE;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#0F6E56;font-size:15px}
.app-title{font-size:16px;font-weight:600}
.app-sub{font-size:10px;color:#888;margin-top:1px}
.sync-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;margin-left:6px}
.sync-badge.on{background:#E1F5EE;color:#0F6E56}
.sync-badge.off{background:#f5f5f5;color:#aaa}
.month-nav{display:flex;align-items:center;gap:6px}
.ib{background:none;border:0.5px solid #d0d0d0;border-radius:7px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#555;font-size:13px;-webkit-appearance:none}
.ib:active{background:#f0f0f0}
.mlabel{font-size:13px;font-weight:600;min-width:78px;text-align:center;color:#1a1a1a}
.scroll-area{padding:12px 12px 100px}
.store-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.store-tabs::-webkit-scrollbar{display:none}
.stab{font-size:12px;padding:5px 12px;border-radius:20px;border:0.5px solid #d0d0d0;cursor:pointer;color:#666;background:#fff;white-space:nowrap;flex-shrink:0}
.stab:active{opacity:.7}
.stab.act{font-weight:600}
.stab.all.act{background:#f0f0f0;color:#1a1a1a;border-color:#aaa}
.add-s{font-size:11px;padding:4px 10px;border-radius:20px;border:0.5px dashed #ccc;cursor:pointer;color:#aaa;background:none;white-space:nowrap;flex-shrink:0}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.mc{background:#fff;border-radius:10px;padding:11px 13px;border:0.5px solid #e8e8e8}
.mc-lbl{font-size:11px;color:#888;margin-bottom:3px}
.mc-val{font-size:22px;font-weight:700}
.mc-sub{font-size:10px;color:#aaa;margin-top:1px}
.sec-lbl{font-size:11px;font-weight:600;color:#888;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
.staff-cards{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.sc{background:#fff;border:0.5px solid #e8e8e8;border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-appearance:none}
.sc:active{background:#f8f8f8}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.sc-mid{flex:1;min-width:0}
.sn{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sr{font-size:11px;color:#888;margin-top:2px}
.bar-w{height:4px;background:#eee;border-radius:2px;margin-top:5px;overflow:hidden}
.bar-f{height:4px;border-radius:2px}
.sc-right{text-align:right;flex-shrink:0}
.sc-rate{font-size:17px;font-weight:700}
.sc-rate-lbl{font-size:10px;color:#888}
.rb{font-size:10px;padding:2px 5px;border-radius:7px;font-weight:600}
.g{background:#E1F5EE;color:#0F6E56}
.wa{background:#FAEEDA;color:#854F0B}
.dn{background:#FCEBEB;color:#A32D2D}
.add-card{background:#fff;border:0.5px dashed #ccc;border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:12px}
.add-card:active{background:#f8f8f8}
.add-card span{font-size:13px;color:#888}
.detail-panel{background:#fff;border:0.5px solid #1D9E75;border-radius:12px;padding:13px;margin-bottom:12px}
.dp-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dp-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.dp-close{background:none;border:0.5px solid #d0d0d0;border-radius:7px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#555;font-size:13px}
.dp-close:active{background:#f0f0f0}
.month-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.ms-card{background:#f5f5f5;border-radius:8px;padding:8px 10px}
.ms-lbl{font-size:10px;color:#888;margin-bottom:2px}
.ms-val{font-size:16px;font-weight:700}
.chart-wrap{position:relative;width:100%;margin-bottom:12px}
.legend-row{display:flex;gap:12px;margin-bottom:7px;font-size:11px;color:#666}
.li{display:flex;align-items:center;gap:4px}
.ld{width:10px;height:10px;border-radius:2px}
.week-tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.week-tabs::-webkit-scrollbar{display:none}
.wtab{font-size:12px;padding:4px 12px;border-radius:20px;border:0.5px solid #d0d0d0;cursor:pointer;color:#666;background:#fff;white-space:nowrap;flex-shrink:0}
.wtab.act{background:#f0f0f0;color:#1a1a1a;border-color:#aaa;font-weight:600}
.wk-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.wkm{background:#f5f5f5;border-radius:8px;padding:8px 10px}
.wkm-lbl{font-size:10px;color:#888;margin-bottom:2px}
.wkm-val{font-size:15px;font-weight:700}
.day-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:11px;font-weight:600;color:#888;padding:6px 5px;border-bottom:1px solid #e0e0e0;text-align:center;white-space:nowrap}
th:first-child{text-align:left}
td{padding:6px 5px;border-bottom:0.5px solid #f0f0f0;text-align:center;vertical-align:middle}
td:first-child{text-align:left;color:#888;font-size:11px;white-space:nowrap}
td input{width:54px;font-size:13px;padding:4px 6px;text-align:center;border:0.5px solid #d0d0d0;border-radius:6px;background:#fff;color:#1a1a1a;-webkit-appearance:none;appearance:none}
td input:focus{outline:none;border-color:#1D9E75}
.save-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.btn-save{font-size:13px;padding:8px 20px;background:#1D9E75;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;-webkit-appearance:none}
.btn-save:active{opacity:.8}
.btn-del{font-size:12px;color:#E24B4A;background:none;border:none;cursor:pointer;padding:6px 8px;display:flex;align-items:center;gap:3px}
.toast-wrap{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:200;pointer-events:none}
.toast{background:#0F6E56;color:#fff;border-radius:20px;padding:8px 20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px;text-align:center}
.fr{margin-bottom:10px}
.fr label{display:block;font-size:12px;color:#888;margin-bottom:3px;font-weight:600}
.fr input,.fr select{width:100%;font-size:15px;padding:9px 12px;border:0.5px solid #d0d0d0;border-radius:8px;background:#fff;color:#1a1a1a;-webkit-appearance:none;appearance:none}
.fr input:focus,.fr select:focus{outline:none;border-color:#1D9E75}
.ma{display:flex;gap:8px;margin-top:14px}
.bc{flex:1;font-size:14px;padding:10px;background:#f0f0f0;border:none;border-radius:8px;cursor:pointer;color:#555;font-weight:600}
.bp{flex:2;font-size:14px;padding:10px;background:#1D9E75;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700}
.bp:active{opacity:.8}
.ov-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ov-row{background:#fff;border:0.5px solid #e8e8e8;border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer}
.ov-row:active{background:#f8f8f8}
.ov-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ov-mid{flex:1;min-width:0}
.ov-name{font-size:13px;font-weight:600}
.ov-meta{font-size:11px;color:#888;margin-top:1px}
.ov-count{font-size:19px;font-weight:700;text-align:right;flex-shrink:0}
.ov-count-lbl{font-size:10px;color:#888;text-align:right}
</style>
</head>

<div class="safe-top"></div>
<div class="app-bar">
  <div class="app-bar-left">
    <div class="logo">✂</div>
    <div>
      <div class="app-title">次回予約管理 <span class="sync-badge off" id="syncBadge">●オフライン</span></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgotJZignUzDOSyoayuUm7UJmy2nelxno",
  authDomain: "fleurami-next-reseve.firebaseapp.com",
  databaseURL: "https://fleurami-next-reseve-default-rtdb.firebaseio.com",
  projectId: "fleurami-next-reseve",
  storageBucket: "fleurami-next-reseve.firebasestorage.app",
  messagingSenderId: "100846735246",
  appId: "1:100846735246:web:e2ed35b8feac2433879edf"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
window._db = db;
window._fbRef = ref;
window._fbSet = set;

// リアルタイム同期
onValue(ref(db, 'salonData'), (snapshot) => {
  const data = snapshot.val();
  if (data && data.stores && data.staff) {
    state.stores = data.stores;
    state.staff = data.staff;
    state.daily = data.daily || {};
    renderAll();
  }
  document.getElementById('syncBadge').textContent = '●同期中';
  document.getElementById('syncBadge').className = 'sync-badge on';
}, (error) => {
  document.getElementById('syncBadge').textContent = '●オフライン';
  document.getElementById('syncBadge').className = 'sync-badge off';
});

window._fbReady = true;
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const SC=['#185FA5','#0F6E56','#854F0B','#993C1D','#534AB7','#3B6D11'];
const AC=[['#3266ad','#B5D4F4'],['#0F6E56','#9FE1CB'],['#BA7517','#FAC775'],['#993356','#F4C0D1'],['#534AB7','#CECBF6'],['#639922','#C0DD97'],['#993C1D','#F5C4B3']];
const MN=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const DN=['日','月','火','水','木','金','土'];

const INIT={
  stores:[{id:1,name:'渋谷店'},{id:2,name:'新宿店'},{id:3,name:'銀座店'}],
  staff:[
    {id:1,storeId:1,name:'田中 彩香',role:'チーフ'},
    {id:2,storeId:1,name:'鈴木 健太',role:'スタイリスト'},
    {id:3,storeId:2,name:'山田 美穂',role:'チーフ'},
    {id:4,storeId:2,name:'小林 拓也',role:'スタイリスト'},
    {id:5,storeId:3,name:'佐藤 由美',role:'チーフ'},
    {id:6,storeId:3,name:'伊藤 誠',role:'スタイリスト'},
  ],
  daily:{}
};

let state = JSON.parse(JSON.stringify(INIT));

async function save(){
  if(window._fbReady && window._db){
    try{
      await window._fbSet(window._fbRef(window._db,'salonData'), state);
    }catch(e){console.warn('Firebase save error',e);}
  }
}

const now=new Date();
let cy=now.getFullYear(),cm=now.getMonth();
let selStore='all',selStaff=null,selWeek=1;
let chartInst=null;

function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function weekOf(d){return Math.ceil(d/7);}
function getWeeks(y,m){return Math.ceil(daysInMonth(y,m)/7);}
function dayName(y,m,d){return DN[new Date(y,m,d).getDay()];}
function getDayData(sid,y,m,d){
  const k=`${y}-${m}-${d}`;
  if(!state.daily[k])state.daily[k]={};
  if(!state.daily[k][sid])state.daily[k][sid]={visit:0,booking:0};
  return state.daily[k][sid];
}
function getMonthTotals(sid,y,m){
  let v=0,b=0;
  for(let d=1;d<=daysInMonth(y,m);d++){const dd=getDayData(sid,y,m,d);v+=dd.visit;b+=dd.booking;}
  return{visit:v,booking:b};
}
function getWeekTotals(sid,y,m,wk){
  let v=0,b=0;
  for(let d=1;d<=daysInMonth(y,m);d++){
    if(weekOf(d)===wk){const dd=getDayData(sid,y,m,d);v+=dd.visit;b+=dd.booking;}
  }
  return{visit:v,booking:b};
}
function rate(v,b){return v>0?Math.round(b/v*100):0;}
function rb(r){
  if(r>=80)return`<span class="rb g">${r}%</span>`;
  if(r>=50)return`<span class="rb wa">${r}%</span>`;
  return`<span class="rb dn">${r}%</span>`;
}
function storeColor(sid){return SC[state.stores.findIndex(s=>s.id===sid)%SC.length];}
function staffColor(idx){const c=AC[idx%AC.length];return c[0];}

function renderTabs(){
  const el=document.getElementById('storeTabs');
  el.innerHTML=`<button class="stab all${selStore==='all'?' act':''}" data-sid="all">全店舗</button>`
    +state.stores.map(s=>`<button class="stab${selStore===s.id?' act':''}" data-sid="${s.id}" style="${selStore===s.id?`background:${storeColor(s.id)}18;color:${storeColor(s.id)};border-color:${storeColor(s.id)}55`:''}">${s.name}</button>`).join('')
    +`<button class="add-s" id="addStoreBtn">＋ 店舗追加</button>`
    +(selStore!=='all'?`<button class="add-s" id="delStoreBtn" style="color:#E24B4A;border-color:#E24B4A55">🗑 店舗削除</button>`:'');
  el.querySelectorAll('.stab').forEach(b=>b.addEventListener('click',()=>{
    selStore=b.dataset.sid==='all'?'all':+b.dataset.sid;selStaff=null;renderAll();
  }));
  document.getElementById('addStoreBtn').addEventListener('click',()=>openModal('store'));
  const delBtn=document.getElementById('delStoreBtn');
  if(delBtn)delBtn.addEventListener('click',()=>openModal('delStore'));
}

function visibleStaff(){
  return selStore==='all'?state.staff:state.staff.filter(s=>s.storeId===selStore);
}

function renderMetrics(){
  const sl=visibleStaff();
  let tv=0,tb=0;
  sl.forEach(st=>{const t=getMonthTotals(st.id,cy,cm);tv+=t.visit;tb+=t.booking;});
  const avgR=rate(tv,tb);
  const ac=selStore==='all'?'#1a1a1a':storeColor(selStore);
  const rc=avgR>=80?'#0F6E56':avgR>=50?'#854F0B':'#A32D2D';
  document.getElementById('metricsArea').innerHTML=`
    <div class="mc"><div class="mc-lbl">月間入客数</div><div class="mc-val" style="color:${ac}">${tv}</div><div class="mc-sub">名</div></div>
    <div class="mc"><div class="mc-lbl">次回予約数</div><div class="mc-val" style="color:${ac}">${tb}</div><div class="mc-sub">件</div></div>
    <div class="mc"><div class="mc-lbl">予約率</div><div class="mc-val" style="color:${rc}">${avgR}%</div><div class="mc-sub">入客比</div></div>
    <div class="mc"><div class="mc-lbl">担当者数</div><div class="mc-val">${sl.length}</div><div class="mc-sub">名</div></div>`;
}

function renderStaffOrOverview(){
  const el=document.getElementById('staffOrOverview');
  const sl=visibleStaff();
  if(selStore==='all'){
    const maxB=Math.max(1,...state.stores.map(s=>state.staff.filter(st=>st.storeId===s.id).reduce((sum,st)=>sum+getMonthTotals(st.id,cy,cm).booking,0)));
    document.getElementById('staffSectionLabel').textContent='店舗別サマリー';
    el.innerHTML='<div class="ov-grid">'+state.stores.map(s=>{
      const sl2=state.staff.filter(st=>st.storeId===s.id);
      const tv=sl2.reduce((sum,st)=>sum+getMonthTotals(st.id,cy,cm).visit,0);
      const tb=sl2.reduce((sum,st)=>sum+getMonthTotals(st.id,cy,cm).booking,0);
      const r=rate(tv,tb);
      const col=storeColor(s.id);
      return`<div class="ov-row" data-sid="${s.id}">
        <div class="ov-icon" style="background:${col}18;color:${col}">🏪</div>
        <div class="ov-mid">
          <div class="ov-name">${s.name} ${rb(r)}</div>
          <div class="ov-meta">${sl2.length}名 · 入客 ${tv}名</div>
          <div class="bar-w" style="margin-top:5px"><div class="bar-f" style="width:${Math.round(tb/maxB*100)}%;background:${col}"></div></div>
        </div>
        <div><div class="ov-count" style="color:${col}">${tb}</div><div class="ov-count-lbl">件</div></div>
      </div>`;
    }).join('')+'</div>';
    el.querySelectorAll('.ov-row').forEach(r=>r.addEventListener('click',()=>{
      selStore=+r.dataset.sid;selStaff=null;renderAll();
    }));
  } else {
    document.getElementById('staffSectionLabel').textContent='担当者一覧';
    const maxB=Math.max(1,...sl.map(st=>getMonthTotals(st.id,cy,cm).booking));
    el.innerHTML='<div class="staff-cards">'+sl.map((st,i)=>{
      const col=staffColor(state.staff.indexOf(st));
      const t=getMonthTotals(st.id,cy,cm);
      const r=rate(t.visit,t.booking);
      const ini=st.name.replace(/\s/g,'').slice(-2);
      const isExp=selStaff===st.id;
      return`<div class="sc${isExp?' sc-active':''}" data-id="${st.id}" style="${isExp?'border-color:#1D9E75;border-width:1.5px':''}">
        <div class="av" style="background:${col}22;color:${col}">${ini}</div>
        <div class="sc-mid">
          <div class="sn">${st.name} ${rb(r)}</div>
          <div class="sr">${st.role} · 入客 ${t.visit}名 · 予約 ${t.booking}件</div>
          <div class="bar-w"><div class="bar-f" style="width:${Math.round(t.booking/maxB*100)}%;background:${col}"></div></div>
        </div>
        <div class="sc-right">
          <div class="sc-rate" style="color:${col}">${r}%</div>
          <div class="sc-rate-lbl">予約率</div>
        </div>
      </div>`;
    }).join('')+'</div>';
    el.querySelectorAll('.sc').forEach(card=>{
      card.addEventListener('click',()=>{
        const id=+card.dataset.id;
        selStaff=id;const now2=new Date();if(cy===now2.getFullYear()&&cm===now2.getMonth()){selWeek=Math.ceil(now2.getDate()/7);}else{selWeek=1;}
        renderAll();
        if(selStaff){setTimeout(()=>document.getElementById('detailArea').scrollIntoView({behavior:'smooth',block:'start'}),50);}
      });
    });
  }
}

function renderDetail(){
  const el=document.getElementById('detailArea');
  if(!selStaff){el.innerHTML='';return;}
  const st=state.staff.find(s=>s.id===selStaff);
  if(!st){el.innerHTML='';return;}
  const col=staffColor(state.staff.indexOf(st));
  const weeks=getWeeks(cy,cm);
  const mt=getMonthTotals(st.id,cy,cm);
  const mr=rate(mt.visit,mt.booking);
  const rc=mr>=80?'#0F6E56':mr>=50?'#854F0B':'#A32D2D';
  if(chartInst){chartInst.destroy();chartInst=null;}
  const wkV=Array.from({length:weeks},(_,i)=>getWeekTotals(st.id,cy,cm,i+1).visit);
  const wkB=Array.from({length:weeks},(_,i)=>getWeekTotals(st.id,cy,cm,i+1).booking);
  const wkLabels=Array.from({length:weeks},(_,i)=>`第${i+1}週`);

  el.innerHTML=`<div class="detail-panel">
    <div class="dp-hd">
      <div class="dp-name">
        <div class="av" style="background:${col}22;color:${col};width:30px;height:30px;font-size:11px">${st.name.replace(/\s/g,'').slice(-2)}</div>
        ${st.name}
      </div>
      <button class="dp-close" id="dpClose">✕</button>
    </div>
    <div class="sec-lbl">月間合計（${MN[cm]}）</div>
    <div class="month-summary" style="margin-bottom:10px">
      <div class="ms-card"><div class="ms-lbl">入客数</div><div class="ms-val">${mt.visit}<span style="font-size:10px;color:#888">名</span></div></div>
      <div class="ms-card"><div class="ms-lbl">次回予約</div><div class="ms-val">${mt.booking}<span style="font-size:10px;color:#888">件</span></div></div>
      <div class="ms-card"><div class="ms-lbl">予約率</div><div class="ms-val" style="color:${rc}">${mr}%</div></div>
    </div>
    <div class="legend-row">
      <span class="li"><span class="ld" style="background:${col}"></span>入客数</span>
      <span class="li"><span class="ld" style="background:${col}55"></span>次回予約数</span>
    </div>
    <div class="chart-wrap" style="height:130px"><canvas id="dpChart"></canvas></div>
    <div class="sec-lbl" style="margin-top:12px">週別 日次入力</div>
    <div class="week-tabs" id="weekTabs">
      ${Array.from({length:weeks},(_,i)=>`<button class="wtab${selWeek===i+1?' act':''}" data-wk="${i+1}">第${i+1}週</button>`).join('')}
    </div>
    <div class="wk-metrics" id="wkMetrics"></div>
    <div class="day-table-wrap">
      <table>
        <thead><tr><th>日付</th><th>曜</th><th>入客</th><th>予約</th><th>率</th></tr></thead>
        <tbody id="dayTableBody"></tbody>
      </table>
    </div>
    <div class="save-row">
      <button class="btn-del" onclick="delStaff(${st.id})">🗑 削除</button>
      <button class="btn-save" id="saveDay">保存する</button>
    </div>
  </div>`;

  renderWeekContent();

  document.getElementById('dpClose').addEventListener('click',()=>{selStaff=null;renderAll();});
  document.getElementById('weekTabs').querySelectorAll('.wtab').forEach(b=>{
    b.addEventListener('click',()=>{
      selWeek=+b.dataset.wk;
      document.querySelectorAll('.wtab').forEach(t=>t.classList.toggle('act',+t.dataset.wk===selWeek));
      renderWeekContent();
    });
  });
  document.getElementById('saveDay').addEventListener('click',async ()=>{
    document.querySelectorAll('.day-inp').forEach(inp=>{
      const d=+inp.dataset.d,type=inp.dataset.type;
      getDayData(selStaff,cy,cm,d)[type]=Math.max(0,+inp.value||0);
    });
    await save();
    showToast('保存しました ✓');
    selStaff=null;renderAll();
  });

  setTimeout(()=>{
    const canvas=document.getElementById('dpChart');
    if(!canvas||!window.Chart)return;
    chartInst=new Chart(canvas,{
      type:'bar',
      data:{
        labels:wkLabels,
        datasets:[
          {label:'入客数',data:wkV,backgroundColor:col+'aa',borderColor:col,borderWidth:1},
          {label:'次回予約数',data:wkB,backgroundColor:col+'44',borderColor:col,borderWidth:1}
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{
          x:{ticks:{color:'#888',font:{size:10}},grid:{display:false}},
          y:{ticks:{color:'#888',font:{size:10}},grid:{color:'rgba(0,0,0,.05)'}}
        }
      }
    });
  },60);
}

function renderWeekContent(){
  const days=daysInMonth(cy,cm);
  const daysOfWeek=[];
  for(let d=1;d<=days;d++){if(weekOf(d)===selWeek)daysOfWeek.push(d);}
  const wt=getWeekTotals(selStaff,cy,cm,selWeek);
  const wr=rate(wt.visit,wt.booking);
  const wrc=wr>=80?'#0F6E56':wr>=50?'#854F0B':'#A32D2D';
  const wkm=document.getElementById('wkMetrics');
  if(wkm)wkm.innerHTML=`
    <div class="wkm"><div class="wkm-lbl">週間入客</div><div class="wkm-val">${wt.visit}<span style="font-size:10px;color:#888">名</span></div></div>
    <div class="wkm"><div class="wkm-lbl">週間予約</div><div class="wkm-val">${wt.booking}<span style="font-size:10px;color:#888">件</span></div></div>
    <div class="wkm"><div class="wkm-lbl">週予約率</div><div class="wkm-val" style="color:${wrc}">${wr}%</div></div>`;
  const tbody=document.getElementById('dayTableBody');
  if(tbody)tbody.innerHTML=daysOfWeek.map(d=>{
    const dd=getDayData(selStaff,cy,cm,d);
    const r=rate(dd.visit,dd.booking);
    const rc=r>=80?'#0F6E56':r>=50?'#854F0B':'#A32D2D';
    const dn=dayName(cy,cm,d);
    const dnStyle=dn==='日'?'color:#E24B4A':dn==='土'?'color:#185FA5':'color:#888';
    const todayObj=new Date();const isToday=cy===todayObj.getFullYear()&&cm===todayObj.getMonth()&&d===todayObj.getDate();const rowStyle=isToday?'background:#f0faf6;':'';const todayBadge=isToday?'<span style="font-size:9px;background:#0F6E56;color:#fff;border-radius:4px;padding:1px 4px;margin-left:3px">今日</span>':'';return`<tr style="${rowStyle}">
      <td>${cm+1}/${d}${todayBadge}</td>
      <td style="${dnStyle}">${dn}</td>
      <td><input type="number" inputmode="numeric" min="0" value="${dd.visit}" class="day-inp" data-d="${d}" data-type="visit"></td>
      <td><input type="number" inputmode="numeric" min="0" value="${dd.booking}" class="day-inp" data-d="${d}" data-type="booking"></td>
      <td style="color:${rc};font-weight:600">${dd.visit>0?r+'%':'—'}</td>
    </tr>`;
  }).join('');
}

function openModal(mode, targetId){
  const ov=document.getElementById('modalOverlay'),box=document.getElementById('modalBox');
  ov.classList.add('open');
  if(mode==='store'){
    box.innerHTML=`<h3>店舗を追加</h3><div class="fr"><label>店舗名</label><input type="text" id="mn" placeholder="例：池袋店"></div><div class="ma"><button class="bc" id="mc">キャンセル</button><button class="bp" id="mok">追加する</button></div>`;
    setTimeout(()=>document.getElementById('mn').focus(),100);
    document.getElementById('mok').addEventListener('click',async ()=>{
      const n=document.getElementById('mn').value.trim();if(!n)return;
      state.stores.push({id:Date.now(),name:n});await save();closeModal();showToast(`${n}を追加しました`);renderAll();
    });
  } else if(mode==='delStore'){
    const store=state.stores.find(s=>s.id===selStore);
    const staffCount=state.staff.filter(s=>s.storeId===selStore).length;
    box.innerHTML=`<h3 style="color:#A32D2D">店舗を削除</h3>
      <p style="font-size:13px;color:#555;margin-bottom:12px;line-height:1.6">「<strong>${store.name}</strong>」を削除します。${staffCount>0?`<br><span style="color:#E24B4A">この店舗の担当者 ${staffCount}名 と全データも削除されます。</span>`:''}</p>
      <div class="ma"><button class="bc" id="mc">キャンセル</button><button class="bp" id="mok" style="background:#E24B4A">削除する</button></div>`;
    document.getElementById('mok').addEventListener('click',async ()=>{
      state.staff.filter(s=>s.storeId===selStore).forEach(st=>{Object.keys(state.daily).forEach(k=>{delete state.daily[k][st.id];});});
      state.staff=state.staff.filter(s=>s.storeId!==selStore);
      state.stores=state.stores.filter(s=>s.id!==selStore);
      selStore='all';selStaff=null;
      await save();closeModal();showToast(`${store.name}を削除しました`);renderAll();
    });
  } else {
    const opts=state.stores.map(s=>`<option value="${s.id}"${(selStore!=='all'&&selStore===s.id)?' selected':''}>${s.name}</option>`).join('');
    box.innerHTML=`<h3>担当者を追加</h3>
      <div class="fr"><label>名前</label><input type="text" id="mn" placeholder="例：田中 花子"></div>
      <div class="fr"><label>役職</label><input type="text" id="mr" placeholder="例：スタイリスト"></div>
      <div class="fr"><label>店舗</label><select id="ms">${opts}</select></div>
      <div class="ma"><button class="bc" id="mc">キャンセル</button><button class="bp" id="mok">追加する</button></div>`;
    setTimeout(()=>document.getElementById('mn').focus(),100);
    document.getElementById('mok').addEventListener('click',async ()=>{
      const n=document.getElementById('mn').value.trim();if(!n)return;
      const r=document.getElementById('mr').value.trim()||'スタイリスト';
      const sid=+document.getElementById('ms').value;
      state.staff.push({id:Date.now(),storeId:sid,name:n,role:r});
      await save();closeModal();showToast(`${n}を追加しました`);renderAll();
    });
  }
  document.getElementById('mc').addEventListener('click',closeModal);
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
window.delStaff=async function(id){
  if(!confirm('この担当者を削除しますか？'))return;
  state.staff=state.staff.filter(s=>s.id!==id);if(selStaff===id)selStaff=null;
  await save();showToast('削除しました');renderAll();
};

function renderAll(){
  document.getElementById('mlabel').textContent=`${cy}年${MN[cm]}`;
  renderTabs();renderMetrics();renderDetail();renderStaffOrOverview();
}

document.getElementById('prevM').addEventListener('click',()=>{cm--;if(cm<0){cm=11;cy--;}selStaff=null;renderAll();});
document.getElementById('nextM').addEventListener('click',()=>{cm++;if(cm>11){cm=0;cy++;}selStaff=null;renderAll();});
document.getElementById('addStaffBtn').addEventListener('click',()=>openModal('staff'));

renderAll();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
